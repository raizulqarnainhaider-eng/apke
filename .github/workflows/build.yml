name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libffi-dev libssl-dev cmake

      - name: Install Buildozer & Dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.33

      - name: Create main.py if missing
        run: |
          if [ ! -f main.py ]; then
            cat << 'EOF' > main.py
          from kivy.app import App
          from kivy.uix.boxlayout import BoxLayout
          from kivy.uix.button import Button
          from kivy.uix.textinput import TextInput

          class CalculatorApp(App):
              def build(self):
                  self.operators = ['/', '*', '+', '-']
                  self.last_was_operator = None
                  main_layout = BoxLayout(orientation="vertical")
                  self.solution = TextInput(multiline=False, readonly=True, halign="right", font_size=55)
                  main_layout.add_widget(self.solution)
                  buttons = [
                      ["7", "8", "9", "/"],
                      ["4", "5", "6", "*"],
                      ["1", "2", "3", "-"],
                      [".", "0", "C", "+"],
                  ]
                  for row in buttons:
                      h_layout = BoxLayout()
                      for label in row:
                          button = Button(text=label, pos_hint={"center_x": 0.5, "center_y": 0.5})
                          button.bind(on_press=self.on_button_press)
                          h_layout.add_widget(button)
                      main_layout.add_widget(h_layout)
                  equals_button = Button(text="=", pos_hint={"center_x": 0.5, "center_y": 0.5})
                  equals_button.bind(on_press=self.on_solution)
                  main_layout.add_widget(equals_button)
                  return main_layout

              def on_button_press(self, instance):
                  current = self.solution.text
                  button_text = instance.text
                  if button_text == 'C':
                      self.solution.text = ""
                  else:
                      if current and (self.last_was_operator and button_text in self.operators):
                          return
                      elif current == "" and button_text in self.operators:
                          return
                      else:
                          self.solution.text += button_text
                  self.last_was_operator = (button_text in self.operators)

              def on_solution(self, instance):
                  text = self.solution.text
                  if text:
                      try:
                          self.solution.text = str(eval(self.solution.text))
                      except Exception:
                          self.solution.text = "Error"

          if __name__ == "__main__":
              CalculatorApp().run()
          EOF
          fi

      - name: Create/Update buildozer.spec
        run: |
          cat << 'EOF' > buildozer.spec
          [app]
          title = Calculator
          package.name = calculator
          package.domain = org.myapp
          source.dir = .
          source.include_exts = py,png,jpg,kv,atlas
          version = 0.1
          requirements = python3,kivy
          orientation = portrait
          fullscreen = 0
          android.archs = arm64-v8a
          android.accept_sdk_license = True
          android.api = 33
          android.minapi = 21
          EOF

      - name: Build APK
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: calculator-apk
          path: bin/*.apk
